[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "election-gender-bias-d4w"
version = "0.1.0"
description = "Gender bias in French media coverage of the 2026 municipal elections — data engineering + NLP portfolio project"
requires-python = ">=3.11"
readme = "README.md"

[project.scripts]
run-sampling-pipeline = "src.cli.run_sampling_pipeline:main"
run-news-corpus-pipeline = "src.cli.run_news_corpus_pipeline:main"
run-nlp-input-pipeline = "src.cli.run_nlp_input_pipeline:main"
run-nlp-lexicon-pipeline = "src.cli.run_nlp_lexicon_pipeline:main"
run-nlp-sentiment-pipeline = "src.cli.run_nlp_sentiment_pipeline:main"
run-nlp-tone-pipeline = "src.cli.run_nlp_tone_pipeline:main"
run-nlp-framing-pipeline = "src.cli.run_nlp_framing_pipeline:main"
run-nlp-tone-sensitivity-pipeline = "src.cli.run_nlp_tone_sensitivity_pipeline:main"
run-nlp-qa-pipeline = "src.cli.run_nlp_qa_pipeline:main"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.setuptools.package-data]
"src.nlp.lexicons" = ["*.json"]

[tool.black]
line-length = 88
target-version = ["py311"]
include = '\.pyi?$'

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
# Rule sets enabled:
#   E  — pycodestyle errors
#   F  — pyflakes (undefined names, unused imports)
#   I  — isort (import order: stdlib → third-party → local)
#   UP — pyupgrade (modernise syntax to Python 3.11+)
#   B  — flake8-bugbear (common bugs and design issues)
#   SIM — flake8-simplify (unnecessary complexity)
select = ["E", "F", "I", "UP", "B", "SIM"]

# E501 is ignored because black enforces line length and the two tools conflict
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
pythonpath = ["."]


