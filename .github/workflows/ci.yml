name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  lint-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e . --no-build-isolation

      - name: Ruff
        run: python -m ruff check src tests scripts

      - name: Black
        run: python -m black --check src tests scripts

      - name: Documentation freshness guard
        if: github.event_name == 'pull_request'
        run: |
          changed_files="$(git diff --name-only origin/${{ github.base_ref }}...HEAD)"
          echo "$changed_files"
          if echo "$changed_files" | grep -Eq '^(src/|dbt/models/|dbt/macros/|Dockerfile|Makefile|requirements)'; then
            echo "$changed_files" | grep -Eq '^(README\.md|docs/)' || {
              echo "Source or model changes require a README/docs update."
              exit 1
            }
          fi

      - name: Pytest
        run: python -m pytest tests -v --tb=short
